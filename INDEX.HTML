<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Candy Crush</title>
 <link rel="stylesheet" href="candy.css">
 <script src="script.js"></script>

</head>
<body class="candy">

    <!--the gear button in the top right corner, it opens the settings-->
    <button id="gearButton" onclick="openSettings()" title="Settings">&#9881;</button>

    <h1>Score: <span id="score">0</span></h1>

    <p id="target">Reach <span id="winScore">500</span> points to win!</p>

    <div id="board">


    </div>

    <!--the settings modal, it is hidden until you click the gear-->
    <!--clicking the dark area closes it-->
    <div id="settingsPopup" onclick="closeSettings()">
        <!--stopPropagation means a click inside the white box does NOT close the modal-->
        <div id="settingsBox" onclick="event.stopPropagation()">
            <h2>Settings</h2>

            <p class="settingLabel">Background</p>
            <div id="themeBar">
                <button id="theme-candy" onclick="setTheme('candy')">Candy</button>
                <button id="theme-ocean" onclick="setTheme('ocean')">Ocean</button>
                <button id="theme-night" onclick="setTheme('night')">Night</button>
            </div>

            <button class="closeButton" onclick="closeSettings()">Close</button>
        </div>
    </div>

    <!--the win pop-up, it is hidden until the player wins-->
    <div id="winPopup">
        <div id="winBox">
            <h2>You Win!</h2>
            <p>You reached <span id="finalScore">0</span> points.</p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

</body>
</html>
